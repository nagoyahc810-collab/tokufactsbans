<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tokufactsbans - Fansub Tokusatsu Indonesia</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body { background: #0a0a0f; color: #eaeaea; min-height: 100vh; }
  header {
    background: linear-gradient(90deg, #1a0000, #8b0000, #1a0000);
    padding: 15px 20px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 3px solid #ffcc00;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 0 25px #ff000080;
    flex-wrap: wrap; gap: 10px;
  }
  .logo {
    font-size: 1.3rem; font-weight: 900; color: #fff;
    text-shadow: 2px 2px 0 #8b0000, 0 0 15px #ffcc00;
    letter-spacing: 1px; font-style: italic;
  }
  .logo span { color: #ffcc00; }
  nav { display: flex; gap: 12px; flex-wrap: wrap; }
  nav a { color: #ccc; text-decoration: none; font-size: 0.85rem; font-weight: bold; }
  nav a:hover { color: #ffcc00; }
  .hero {
    text-align: center; padding: 35px 20px;
    background: radial-gradient(circle at center, #3d0000, #0a0a0f);
    border-bottom: 2px solid #ffcc0040;
  }
  .hero h1 {
    font-size: 1.8rem; color: #ffcc00;
    text-shadow: 2px 2px 0 #8b0000, 0 0 20px #ffcc00;
    margin-bottom: 8px; font-style: italic;
  }
  .hero p { color: #bbb; font-size: 0.9rem; }
  .search-box { margin-top: 18px; max-width: 500px; margin: 18px auto 0; }
  .search-box input {
    width: 100%; padding: 12px 18px; border-radius: 25px;
    border: 2px solid #ffcc00; background: #1a1a2e; color: #fff;
    font-size: 1rem; outline: none;
  }
  .kategori {
    display: flex; gap: 8px; padding: 15px; overflow-x: auto;
    scrollbar-width: none; background: #0f0f18;
    border-bottom: 1px solid #ffcc0030;
  }
  .kategori::-webkit-scrollbar { display: none; }
  .kat-btn {
    padding: 8px 16px; background: #1a1a2e; color: #ccc;
    border: 2px solid #ffcc0040; border-radius: 20px;
    font-size: 0.8rem; cursor: pointer; white-space: nowrap;
    font-weight: bold; transition: all 0.3s;
  }
  .kat-btn.active, .kat-btn:hover {
    background: #8b0000; color: #ffcc00;
    border-color: #ffcc00; box-shadow: 0 0 12px #ffcc0080;
  }
  .container { padding: 20px 15px; max-width: 1100px; margin: auto; }
  .section-title {
    font-size: 1.1rem; color: #ffcc00; margin-bottom: 15px;
    border-left: 5px solid #8b0000; padding-left: 10px; font-style: italic;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 12px;
  }
  .card {
    background: #1a1a2e; border-radius: 12px; overflow: hidden;
    cursor: pointer; transition: transform 0.3s, box-shadow 0.3s;
    border: 2px solid #ffcc0030; text-decoration: none;
    color: inherit; display: block;
  }
  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 25px #ffcc0080; border-color: #ffcc00;
  }
  .card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #2a2a3e; }
  .card-info { padding: 10px; }
  .card-info h3 {
    font-size: 0.85rem; color: #fff; margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-info p { font-size: 0.72rem; color: #999; }
  .badge {
    display: inline-block; background: #ffcc00; color: #000;
    font-size: 0.62rem; padding: 2px 7px; border-radius: 4px;
    margin-top: 6px; font-weight: bold;
  }
  .badge.ongoing { background: #4ade80; color: #000; }
  .badge.completed { background: #8b0000; color: #ffcc00; }
  .error-box {
    background: #2a0a0a; border: 2px solid #ff5555;
    border-radius: 12px; padding: 20px;
    color: #ff9999; text-align: center;
    grid-column: 1 / -1; font-size: 0.9rem; line-height: 1.6;
  }
  .error-box b { color: #ffcc00; }
  .disclaimer {
    background: #1a0a0a; border: 1px solid #8b0000;
    border-radius: 10px; padding: 12px; font-size: 0.75rem;
    color: #bbb; margin: 20px 15px; text-align: center;
  }
  .disclaimer b { color: #ffcc00; }
  footer {
    text-align: center; padding: 25px 20px;
    color: #666; font-size: 0.8rem;
    border-top: 2px solid #ffcc0030; margin-top: 40px;
    background: #0f0f18;
  }
  footer a { color: #ffcc00; text-decoration: none; }
</style>
</head>
<body>

<header>
  <div class="logo">TOKU<span>FACTS</span>BANS</div>
  <nav>
    <a href="index.html">🏠 Home</a>
    <a href="search.html">🔍 Cari</a>
    <a href="genre.html">🎭 Genre</a>
  </nav>
</header>

<section class="hero">
  <h1>⚡ TOKUFACTSBANS</h1>
  <p>Fansub Tokusatsu Subtitle Indonesia</p>
  <div class="search-box">
    <input type="text" id="search" placeholder="🔍 Cari Kamen Rider, Sentai, Ultraman...">
  </div>
</section>

<div class="kategori">
  <button class="kat-btn active" onclick="filterKategori('all', this)">🎬 Semua</button>
  <button class="kat-btn" onclick="filterKategori('Kamen Rider', this)">🏍️ Kamen Rider</button>
  <button class="kat-btn" onclick="filterKategori('Super Sentai', this)">🦖 Super Sentai</button>
  <button class="kat-btn" onclick="filterKategori('Ultraman', this)">🌟 Ultraman</button>
  <button class="kat-btn" onclick="filterKategori('Lainnya', this)">🎭 Lainnya</button>
</div>

<div class="container">
  <h2 class="section-title" id="sectionTitle">📺 Semua Serial</h2>
  <div class="grid" id="animeGrid"></div>
</div>

<div class="disclaimer">
  <b>⚠️ Disclaimer:</b> Tokufactsbans hanya menyediakan subtitle. Kami tidak memiliki hak atas video asli.
</div>

<footer>
  © 2025 <a href="index.html">Tokufactsbans</a> — HENSHIN! ⚡
</footer>

<script src="data.js"></script>
<script>
const grid = document.getElementById('animeGrid');

if (typeof TOKUFACTSBANS_DATA === 'undefined') {
  grid.innerHTML = '<div class="error-box"><b>❌ data.js GAGAL DIMUAT</b><br>Pastikan file ada di folder yang sama.</div>';
} else {
  const tokusatsuList = TOKUFACTSBANS_DATA;
  let currentFilter = 'all';
  let currentSearch = '';

  function renderList() {
    let list = tokusatsuList;
    if (currentFilter !== 'all') list = list.filter(t => t.kategori === currentFilter);
    if (currentSearch) {
      const q = currentSearch.toLowerCase();
      list = list.filter(t => t.judul.toLowerCase().includes(q));
    }
    grid.innerHTML = '';
    if (list.length === 0) {
      grid.innerHTML = '<p style="color:#999;text-align:center;grid-column:1/-1;padding:20px;">Tidak ada serial ditemukan.</p>';
      return;
    }
    list.forEach(t => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = `detail.html?slug=${t.slug}`;
      const bc = t.status === 'Ongoing' ? 'ongoing' : 'completed';
      card.innerHTML = `
        <img src="${t.gambar}" alt="${t.judul}" loading="lazy">
        <div class="card-info">
          <h3>${t.judul}</h3>
          <p>${t.kategori} • ${t.tahun}</p>
          <span class="badge ${bc}">${t.status}</span>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  window.filterKategori = function(kat, btn) {
    currentFilter = kat;
    document.querySelectorAll('.kat-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    document.getElementById('sectionTitle').textContent = kat === 'all' ? '📺 Semua Serial' : `📺 ${kat}`;
    renderList();
  };

  document.getElementById('search').addEventListener('input', (e) => {
    currentSearch = e.target.value;
    renderList();
  });

  renderList();
}
</script>

</body>
</html>
