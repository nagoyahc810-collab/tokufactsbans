<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Series - Tokufactsbans</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body { background: #0a0a0f; color: #eaeaea; min-height: 100vh; }

  header {
    background: linear-gradient(90deg, #1a0000, #8b0000, #1a0000);
    padding: 15px 20px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 3px solid #ffcc00;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 0 25px #ff000080;
  }
  .logo {
    font-size: 1.3rem; font-weight: 900; color: #fff;
    text-shadow: 2px 2px 0 #8b0000, 0 0 15px #ffcc00;
    letter-spacing: 1px; font-style: italic;
  }
  .logo span { color: #ffcc00; }
  .back {
    color: #ffcc00; text-decoration: none; font-size: 0.9rem;
    font-weight: bold;
  }

  /* LAYOUT 2 KOLOM (desktop) */
  .layout {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 20px;
    max-width: 1200px;
    margin: auto;
    padding: 20px 15px;
  }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* BANNER */
  .banner {
    display: flex; gap: 15px; padding: 20px;
    background: linear-gradient(135deg, #1a0000, #0a0a0f);
    border: 2px solid #ffcc0040;
    border-radius: 15px;
    margin-bottom: 20px;
  }
  .banner img {
    width: 130px; height: 180px; object-fit: cover;
    border-radius: 12px; border: 2px solid #ffcc00;
    box-shadow: 0 0 20px #ffcc0080;
    flex-shrink: 0;
  }
  .banner-info h1 {
    font-size: 1.3rem; color: #ffcc00;
    text-shadow: 1px 1px 0 #8b0000;
    margin-bottom: 8px; font-style: italic;
  }
  .banner-info .meta {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px;
  }
  .meta span {
    background: #1a1a2e; border: 1px solid #ffcc0040;
    padding: 3px 10px; border-radius: 12px;
    font-size: 0.72rem; color: #ccc;
  }
  .genre-list { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
  .genre {
    background: #8b0000; color: #ffcc00;
    padding: 3px 10px; border-radius: 12px;
    font-size: 0.7rem; font-weight: bold;
  }
  .badge {
    display: inline-block; background: #ffcc00; color: #000;
    font-size: 0.7rem; padding: 3px 10px; border-radius: 4px;
    font-weight: bold; margin-top: 8px;
  }
  .badge.ongoing { background: #4ade80; }
  .badge.completed { background: #8b0000; color: #ffcc00; }

  /* SECTION */
  .section-title {
    font-size: 1.05rem; color: #ffcc00; margin-bottom: 12px;
    border-left: 5px solid #8b0000; padding-left: 10px;
    font-style: italic;
  }
  .sinopsis {
    background: #1a1a2e; padding: 15px; border-radius: 10px;
    font-size: 0.85rem; line-height: 1.6; color: #ccc;
    border: 1px solid #ffcc0030;
    margin-bottom: 25px;
  }

  /* EPISODE */
  .episode-list { display: flex; flex-direction: column; gap: 8px; }
  .episode {
    display: flex; justify-content: space-between; align-items: center;
    background: #1a1a2e; padding: 12px 15px; border-radius: 10px;
    border-left: 4px solid #8b0000;
    transition: all 0.3s;
    text-decoration: none; color: inherit;
  }
  .episode:hover {
    background: #2a1a1a; border-left-color: #ffcc00;
    transform: translateX(5px);
  }
  .episode-info h4 {
    font-size: 0.9rem; color: #fff; margin-bottom: 3px;
  }
  .episode-info small { font-size: 0.72rem; color: #999; }
  .download-btn {
    background: linear-gradient(90deg, #ffcc00, #ff8c00);
    color: #000; padding: 6px 12px; border-radius: 8px;
    font-size: 0.75rem; font-weight: bold;
    text-decoration: none; white-space: nowrap;
  }
  .download-btn:active { transform: scale(0.95); }

  /* BATCH */
  .batch {
    background: linear-gradient(135deg, #8b0000, #1a0000);
    border: 2px solid #ffcc00; border-radius: 12px;
    padding: 15px; text-align: center; margin-top: 20px;
  }
  .batch h3 { color: #ffcc00; font-size: 1rem; margin-bottom: 8px; }
  .batch p { color: #ccc; font-size: 0.8rem; margin-bottom: 12px; }
  .batch a {
    display: inline-block;
    background: #ffcc00; color: #000;
    padding: 10px 25px; border-radius: 8px;
    text-decoration: none; font-weight: bold; font-size: 0.85rem;
  }

  /* NAV PREV/NEXT */
  .nav-serial {
    display: flex; justify-content: space-between;
    margin-top: 25px; gap: 10px;
  }
  .nav-serial a {
    flex: 1; text-align: center;
    background: #1a1a2e; color: #ffcc00;
    padding: 10px; border-radius: 10px;
    text-decoration: none; font-size: 0.82rem;
    border: 1px solid #ffcc0040;
    font-weight: bold;
  }
  .nav-serial a:hover { background: #8b0000; }

  /* SIDEBAR */
  .sidebar {
    background: #1a1a2e;
    border: 1px solid #ffcc0030;
    border-radius: 15px;
    padding: 15px;
    height: fit-content;
    position: sticky;
    top: 90px;
  }
  .sidebar h3 {
    font-size: 1rem; color: #ffcc00; margin-bottom: 12px;
    border-left: 4px solid #8b0000; padding-left: 8px;
    font-style: italic;
  }
  .sidebar-list {
    display: flex; flex-direction: column; gap: 8px;
    max-height: 70vh; overflow-y: auto;
    padding-right: 5px;
  }
  .sidebar-list::-webkit-scrollbar { width: 5px; }
  .sidebar-list::-webkit-scrollbar-thumb {
    background: #8b0000; border-radius: 3px;
  }
  .sidebar-item {
    display: flex; gap: 10px; align-items: center;
    padding: 8px; border-radius: 8px;
    background: #0f0f18; text-decoration: none; color: inherit;
    border: 1px solid #ffcc0020;
    transition: all 0.3s;
  }
  .sidebar-item:hover {
    background: #2a1a1a; border-color: #ffcc00;
  }
  .sidebar-item.active {
    background: #8b0000; border-color: #ffcc00;
  }
  .sidebar-item img {
    width: 45px; height: 60px; object-fit: cover;
    border-radius: 6px; flex-shrink: 0;
  }
  .sidebar-item-info h4 {
    font-size: 0.78rem; color: #fff; margin-bottom: 2px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .sidebar-item-info small { font-size: 0.68rem; color: #999; }

  /* SECTION: SEMUA SERIES DI BAWAH */
  .all-series-section {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 15px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
  }
  .card {
    background: #1a1a2e; border-radius: 12px; overflow: hidden;
    cursor: pointer; transition: transform 0.3s, box-shadow 0.3s;
    border: 2px solid #ffcc0030; text-decoration: none;
    color: inherit; display: block;
  }
  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 25px #ffcc0080; border-color: #ffcc00;
  }
  .card img {
    width: 100%; aspect-ratio: 3/4; object-fit: cover;
    background: #2a2a3e;
  }
  .card-info { padding: 8px; }
  .card-info h3 {
    font-size: 0.78rem; color: #fff; margin-bottom: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-info p { font-size: 0.68rem; color: #999; }
  .card .badge { font-size: 0.6rem; padding: 2px 6px; margin-top: 4px; }

  footer {
    text-align: center; padding: 25px 20px;
    color: #666; font-size: 0.8rem;
    border-top: 2px solid #ffcc0030; margin-top: 40px;
    background: #0f0f18;
  }
  footer a { color: #ffcc00; text-decoration: none; }
</style>
</head>
<body>

<header>
  <div class="logo">TOKU<span>FACTS</span>BANS</div>
  <a href="index.html" class="back">← Kembali</a>
</header>

<div id="content">
  <p style="text-align:center;padding:40px;color:#999;">Memuat data series...</p>
</div>

<footer>
  © 2025 <a href="index.html">Tokufactsbans</a> — HENSHIN! ⚡
</footer>

<script src="data.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const slug = params.get('slug');

const list = TOKUFACTSBANS_DATA;
const series = list.find(s => s.slug === slug);

const content = document.getElementById('content');

if (!series) {
  content.innerHTML = `
    <div style="text-align:center;padding:50px 20px;max-width:600px;margin:auto;">
      <h2 style="color:#ffcc00;margin-bottom:15px;">❌ Series tidak ditemukan</h2>
      <p style="color:#999;margin-bottom:20px;">Slug tidak valid atau data belum tersedia.</p>
      <a href="index.html" style="background:#ffcc00;color:#000;padding:10px 25px;border-radius:8px;text-decoration:none;font-weight:bold;">← Kembali ke Home</a>
    </div>
  `;
} else {
  document.title = series.judul + " - Tokufactsbans";
  const badgeClass = series.status === 'Ongoing' ? 'ongoing' : 'completed';
  const episodes = series.episodes || [];
  const batch = series.batch || null;
  const genres = series.genre || [];
  const produser = series.produser || '-';

  const idx = list.findIndex(s => s.slug === slug);
  const prev = list[idx - 1] || null;
  const next = list[idx + 1] || null;

  // Genre HTML
  let genreHTML = genres.map(g => `<span class="genre">${g}</span>`).join('');

  // Episode HTML
  let episodeHTML = '';
  if (episodes.length === 0) {
    episodeHTML = '<p style="color:#999;text-align:center;padding:15px;">Episode belum tersedia.</p>';
  } else {
    episodes.forEach(e => {
      episodeHTML += `
        <a class="episode" href="${e.link}" target="_blank">
          <div class="episode-info">
            <h4>Episode ${e.ep} - ${e.judul}</h4>
            <small>📦 ${e.size} • 1080p • Sub Indo</small>
          </div>
          <span class="download-btn">⬇ Download</span>
        </a>
      `;
    });
  }

  // Batch HTML
  let batchHTML = '';
  if (batch) {
    batchHTML = `
      <div class="batch">
        <h3>📦 Download Batch</h3>
        <p>Semua episode dalam 1 paket (${episodes.length} eps • ${batch.size})</p>
        <a href="${batch.link}" target="_blank">⬇ Download Batch</a>
      </div>
    `;
  }

  // Sidebar HTML (series lain)
  let sidebarHTML = '';
  list.forEach(s => {
    const isActive = s.slug === slug ? 'active' : '';
    sidebarHTML += `
      <a href="detail.html?slug=${s.slug}" class="sidebar-item ${isActive}">
        <img src="${s.gambar}" alt="${s.judul}">
        <div class="sidebar-item-info">
          <h4>${s.judul}</h4>
          <small>${s.episode} • ${s.tahun}</small>
        </div>
      </a>
    `;
  });

  // Grid semua series (di bawah)
  let gridHTML = '';
  list.forEach(s => {
    const bc = s.status === 'Ongoing' ? 'ongoing' : 'completed';
    gridHTML += `
      <a href="detail.html?slug=${s.slug}" class="card">
        <img src="${s.gambar}" alt="${s.judul}" loading="lazy">
        <div class="card-info">
          <h3>${s.judul}</h3>
          <p>${s.episode} • ${s.tahun}</p>
          <span class="badge ${bc}">${s.status}</span>
        </div>
      </a>
    `;
  });

  content.innerHTML = `
    <div class="layout">
      <!-- KOLOM UTAMA -->
      <div>
        <div class="banner">
          <img src="${series.gambar}" alt="${series.judul}">
          <div class="banner-info">
            <h1>${series.judul}</h1>
            <div class="meta">
              <span>📺 ${series.kategori}</span>
              <span>📅 ${series.tahun}</span>
              <span>🎬 ${series.episode}</span>
              <span>🏢 ${produser}</span>
            </div>
            <div class="genre-list">${genreHTML}</div>
            <span class="badge ${badgeClass}">${series.status}</span>
          </div>
        </div>

        <h2 class="section-title">📖 Sinopsis</h2>
        <div class="sinopsis">${series.sinopsis}</div>

        <h2 class="section-title">📥 Daftar Episode</h2>
        <div class="episode-list">${episodeHTML}</div>

        ${batchHTML}

        <div class="nav-serial">
          ${prev ? `<a href="detail.html?slug=${prev.slug}">← ${prev.judul}</a>` : '<span></span>'}
          ${next ? `<a href="detail.html?slug=${next.slug}">${next.judul} →</a>` : '<span></span>'}
        </div>
      </div>

      <!-- SIDEBAR -->
      <aside class="sidebar">
        <h3>🎬 Series Lainnya</h3>
        <div class="sidebar-list">${sidebarHTML}</div>
      </aside>
    </div>

    <!-- SEMUA SERIES DI BAWAH -->
    <div class="all-series-section">
      <h2 class="section-title">📺 Semua Series Tokufactsbans</h2>
      <div class="grid">${gridHTML}</div>
    </div>
  `;
}
</script>

</body>
</html>
